<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradJob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="cardGradJob" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGradJob" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadowJob" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGradJob)"/>

  <!-- Subtle Blueprint Tech Lines -->
  <g stroke="rgba(56,189,248,0.04)" stroke-width="1">
    <circle cx="400" cy="240" r="180" fill="none"/>
    <circle cx="400" cy="240" r="320" fill="none"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
  </g>

  <!-- App Window Container -->
  <g filter="url(#shadowJob)" transform="translate(30, 24)">
    <!-- Window Frame -->
    <rect width="740" height="432" rx="14" fill="#0d1424" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Window Titlebar -->
    <rect width="740" height="42" rx="14" fill="#131c31"/>
    <rect y="32" width="740" height="10" fill="#131c31"/>
    <line x1="0" y1="42" x2="740" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="96" y="9" width="340" height="24" rx="6" fill="#090e18" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <circle cx="112" cy="21" r="3.5" fill="#38bdf8"/>
    <text x="124" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">https://afsul2004.github.io/job_portal</text>

    <!-- Architecture Meta Tag -->
    <rect x="500" y="9" width="220" height="24" rx="6" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
    <text x="510" y="25" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">17 DB Tables • RBAC (Admin/HR)</text>

    <!-- App Header & Navigation Bar -->
    <rect x="0" y="43" width="740" height="52" fill="#111a2e"/>
    <line x1="0" y1="95" x2="740" y2="95" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Logo & Subtitle -->
    <text x="28" y="74" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16">RECRUIT<tspan fill="#38bdf8">EXAM</tspan></text>
    <text x="145" y="74" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">| Candidate Examination Portal</text>

    <!-- Top Status Badges -->
    <rect x="470" y="55" width="125" height="28" rx="6" fill="#1e293b"/>
    <text x="483" y="73" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">Timer: 24:18 left</text>

    <rect x="605" y="55" width="115" height="28" rx="6" fill="#0369a1"/>
    <text x="618" y="73" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Submit Exam</text>

    <!-- Body Layout: Left Sidebar + Center Exam Engine + Right Rule Engine -->
    <!-- Left Navigation / Sections -->
    <g transform="translate(18, 108)">
      <rect width="160" height="306" rx="8" fill="#101827" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="16" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">NAVIGATION</text>
      
      <rect x="10" y="40" width="140" height="28" rx="6" fill="rgba(56,189,248,0.15)"/>
      <text x="22" y="58" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">📝 Active Exam</text>

      <text x="22" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">👤 Candidate Profile</text>
      <text x="22" y="122" fill="#94a3b8" font-family="sans-serif" font-size="11">💼 Job Vacancies</text>
      <text x="22" y="154" fill="#94a3b8" font-family="sans-serif" font-size="11">📊 Exam Results</text>
      <text x="22" y="186" fill="#94a3b8" font-family="sans-serif" font-size="11">🏢 Exam Centres</text>
      <text x="22" y="218" fill="#94a3b8" font-family="sans-serif" font-size="11">👥 HR Onboarding</text>

      <!-- DB Badge in Sidebar -->
      <line x1="12" y1="240" x2="148" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="16" y="260" fill="#0284c7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">DATABASE ENGINE</text>
      <text x="16" y="280" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">MySQL 8.0 • 17 Tables</text>
      <text x="16" y="296" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">Normalized 3NF</text>
    </g>

    <!-- Center: Interactive Examination Question Card -->
    <g transform="translate(190, 108)">
      <rect width="330" height="306" rx="8" fill="url(#cardGradJob)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      
      <!-- Question Header -->
      <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">QUESTION 08 / 10 • PYTHON &amp; DB</text>
      <text x="250" y="26" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">[Auto-Saved]</text>
      <line x1="16" y1="36" x2="314" y2="36" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- Question Text -->
      <text x="16" y="60" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Which FastAPI dependency pattern is used to</text>
      <text x="16" y="78" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">inject database session with transaction safety?</text>

      <!-- MCQ Options -->
      <g transform="translate(16, 96)">
        <!-- Option A -->
        <rect width="298" height="34" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <text x="14" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11">A. @app.on_event("startup") global session</text>

        <!-- Option B (Selected) -->
        <rect y="42" width="298" height="34" rx="6" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="1.5"/>
        <text x="14" y="64" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="700">B. Depends(get_db) with yield &amp; session.close()</text>

        <!-- Option C -->
        <rect y="84" width="298" height="34" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <text x="14" y="106" fill="#94a3b8" font-family="sans-serif" font-size="11">C. Hardcoded pymysql cursor in routers</text>

        <!-- Option D -->
        <rect y="126" width="298" height="34" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <text x="14" y="148" fill="#94a3b8" font-family="sans-serif" font-size="11">D. Direct connection without connection pool</text>
      </g>

      <!-- Question Palette Nav -->
      <line x1="16" y1="274" x2="314" y2="274" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="36" cy="289" r="9" fill="#10b981"/>
      <text x="36" y="293" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">1</text>
      <circle cx="62" cy="289" r="9" fill="#10b981"/>
      <text x="62" y="293" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">2</text>
      <circle cx="88" cy="289" r="9" fill="#10b981"/>
      <text x="88" y="293" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">3</text>
      <circle cx="114" cy="289" r="9" fill="#10b981"/>
      <text x="114" y="293" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">4</text>
      <circle cx="140" cy="289" r="9" fill="#10b981"/>
      <text x="140" y="293" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">5</text>
      <circle cx="166" cy="289" r="9" fill="#10b981"/>
      <text x="166" y="293" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">6</text>
      <circle cx="192" cy="289" r="9" fill="#10b981"/>
      <text x="192" y="293" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">7</text>
      <circle cx="218" cy="289" r="9" fill="#2563eb"/>
      <text x="218" y="293" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">8</text>
      <circle cx="244" cy="289" r="9" fill="#475569"/>
      <text x="244" y="293" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">9</text>
      <circle cx="270" cy="289" r="9" fill="#475569"/>
      <text x="270" y="293" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle">10</text>
    </g>

    <!-- Right: Automated Eligibility Rule Engine Panel -->
    <g transform="translate(532, 108)">
      <rect width="190" height="306" rx="8" fill="#10182a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">ELIGIBILITY ENGINE</text>
      <line x1="14" y1="34" x2="176" y2="34" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

      <!-- Rule 1: Programmer -->
      <rect x="12" y="44" width="166" height="74" rx="6" fill="#16223b" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
      <text x="20" y="60" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Programmer Role</text>
      <text x="20" y="76" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">• Exam Score &gt; 8.0 / 10</text>
      <text x="20" y="90" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">• Academic &gt; 75.0%</text>
      <text x="20" y="106" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600">✓ Real-time Evaluated</text>

      <!-- Rule 2: Data Entry Operator -->
      <rect x="12" y="126" width="166" height="74" rx="6" fill="#16223b" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
      <text x="20" y="142" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">Data Entry Role</text>
      <text x="20" y="158" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">• Exam Score 6.0 - 8.0</text>
      <text x="20" y="172" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">• Academic &gt; 65.0%</text>
      <text x="20" y="188" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600">✓ Real-time Evaluated</text>

      <!-- Security & Testing Specs -->
      <rect x="12" y="208" width="166" height="88" rx="6" fill="#0d1424" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="20" y="224" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SECURITY &amp; TESTS</text>
      <text x="20" y="240" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">• Bcrypt + JWT RBAC</text>
      <text x="20" y="254" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">• Server-side timers</text>
      <text x="20" y="268" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">• Pytest API Suite</text>
      <text x="20" y="284" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">✓ 100% Boundary Valid</text>
    </g>
  </g>
</svg>
