<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGradEcom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGradEcom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadowEcom" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGradEcom)"/>
  
  <!-- Subtle Grid Accent -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="800"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Browser/App Window Container -->
  <g filter="url(#shadowEcom)" transform="translate(30, 24)">
    <!-- Window Frame -->
    <rect width="740" height="432" rx="14" fill="#0d1320" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Window Titlebar -->
    <rect width="740" height="42" rx="14" fill="#131b2d"/>
    <rect y="32" width="740" height="10" fill="#131b2d"/>
    <line x1="0" y1="42" x2="740" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="96" y="9" width="340" height="24" rx="6" fill="#0a0e17" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <circle cx="112" cy="21" r="3.5" fill="#10b981"/>
    <text x="124" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">https://afsul2004.github.io/ecom_website</text>

    <!-- Backend API Status Tag -->
    <rect x="530" y="9" width="190" height="24" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <text x="542" y="25" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11">FastAPI • MySQL :8000</text>

    <!-- App Header -->
    <rect x="0" y="43" width="740" height="54" fill="#111827"/>
    <line x1="0" y1="97" x2="740" y2="97" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Logo -->
    <text x="28" y="77" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" letter-spacing="0.5">AMFLIP<tspan fill="#38bdf8">.</tspan></text>
    
    <!-- Navigation Links -->
    <text x="140" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Smartphones</text>
    <text x="240" y="75" fill="#94a3b8" font-family="sans-serif" font-size="12">Laptops</text>
    <text x="310" y="75" fill="#94a3b8" font-family="sans-serif" font-size="12">Audio</text>
    <text x="370" y="75" fill="#94a3b8" font-family="sans-serif" font-size="12">Orders</text>
    
    <!-- Cart & Auth Pills -->
    <rect x="560" y="56" width="75" height="28" rx="6" fill="#1e293b"/>
    <text x="575" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">Cart (2)</text>

    <rect x="645" y="56" width="75" height="28" rx="6" fill="url(#accentGradEcom)"/>
    <text x="664" y="74" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Sign In</text>

    <!-- Hero Banner inside Mockup -->
    <rect x="24" y="112" width="692" height="110" rx="10" fill="url(#cardGradEcom)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="48" y="150" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">FLAGSHIP E-COMMERCE STACK</text>
    <text x="48" y="180" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Next-Gen Tech &amp; Lifestyle Store</text>
    <text x="48" y="202" fill="#94a3b8" font-family="sans-serif" font-size="12">FastAPI Backend • JWT Auth • Dynamic Cart &amp; Checkout • MySQL Persistence</text>

    <!-- Live Swagger Badge -->
    <rect x="560" y="150" width="136" height="34" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="580" y="172" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Swagger /docs</text>

    <!-- Product Grid inside Mockup -->
    <!-- Product 1 -->
    <g transform="translate(24, 236)">
      <rect width="218" height="176" rx="10" fill="url(#cardGradEcom)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <rect x="16" y="14" width="186" height="85" rx="6" fill="#1e293b" fill-opacity="0.6"/>
      <!-- Icon/Preview -->
      <circle cx="109" cy="56" r="22" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="109" y="62" fill="#60a5fa" font-family="sans-serif" font-size="18" text-anchor="middle">📱</text>
      <text x="16" y="120" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="700">Galaxy Ultra Pro 5G</text>
      <text x="16" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11">Snapdragon 8 Gen 3 • 12GB</text>
      <text x="16" y="162" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">₹74,999</text>
      <rect x="135" y="146" width="67" height="24" rx="5" fill="#2563eb"/>
      <text x="151" y="162" fill="#fff" font-family="sans-serif" font-size="11" font-weight="600">+ Add</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(261, 236)">
      <rect width="218" height="176" rx="10" fill="url(#cardGradEcom)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <rect x="16" y="14" width="186" height="85" rx="6" fill="#1e293b" fill-opacity="0.6"/>
      <circle cx="109" cy="56" r="22" fill="#6366f1" fill-opacity="0.2"/>
      <text x="109" y="62" fill="#818cf8" font-family="sans-serif" font-size="18" text-anchor="middle">💻</text>
      <text x="16" y="120" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="700">MacBook Pro M3</text>
      <text x="16" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11">16-core GPU • 18GB Unified</text>
      <text x="16" y="162" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">₹1,69,900</text>
      <rect x="135" y="146" width="67" height="24" rx="5" fill="#2563eb"/>
      <text x="151" y="162" fill="#fff" font-family="sans-serif" font-size="11" font-weight="600">+ Add</text>
    </g>

    <!-- Product 3 / Architecture Snippet -->
    <g transform="translate(498, 236)">
      <rect width="218" height="176" rx="10" fill="#0c121e" stroke="rgba(99,102,241,0.25)" stroke-width="1"/>
      <text x="16" y="28" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">REST API ARCHITECTURE</text>
      <line x1="16" y1="36" x2="202" y2="36" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      
      <rect x="16" y="46" width="38" height="18" rx="4" fill="#059669"/>
      <text x="21" y="59" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10">GET</text>
      <text x="60" y="60" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">/api/products</text>

      <rect x="16" y="72" width="38" height="18" rx="4" fill="#2563eb"/>
      <text x="18" y="85" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10">POST</text>
      <text x="60" y="86" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">/api/orders</text>

      <rect x="16" y="98" width="38" height="18" rx="4" fill="#7c3aed"/>
      <text x="18" y="111" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10">POST</text>
      <text x="60" y="112" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">/api/auth/token</text>

      <rect x="16" y="124" width="38" height="18" rx="4" fill="#059669"/>
      <text x="21" y="137" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10">GET</text>
      <text x="60" y="138" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">/api/admin/metrics</text>

      <rect x="16" y="148" width="186" height="20" rx="4" fill="rgba(16,185,129,0.1)"/>
      <text x="24" y="162" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">Pytest test suite: 100% Pass</text>
    </g>
  </g>
</svg>
